<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - PesaLoan254</title>
<style>
body{font-family:sans-serif;margin:0;background:#f4f4f4;color:#333;padding:20px}
.card{background:white;padding:20px;border-radius:12px;max-width:600px;margin:auto}
h1{color:#0a7a42}
.btn{display:block;text-align:center;padding:14px;border-radius:10px;text-decoration:none;margin-top:12px;font-weight:bold}
.blue{background:#0a7a42;color:white}
.grey{background:#eee;color:#333}
input,textarea{width:100%;padding:12px;margin-top:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="card">
<h1>Contact Us</h1>
<p>Have a question about comparing loans? Send us a message.</p>

<a class="btn blue" href="mailto:info@pesaloan254.co.ke">📧 Email Us - info@pesaloan254.co.ke</a>

<h3>Send a Message</h3>
<form>
<input type="text" placeholder="Your Name" required>
<input type="tel" placeholder="Your Phone Number" required>
<textarea rows="4" placeholder="Your Message... e.g. I need help comparing loans"></textarea>
<button type="submit" class="btn blue" style="border:none;width:100%;cursor:pointer;">Send Message</button>
</form>
<p style="font-size:13px;color:#777;">We are not a lender. For loan approval, please apply directly via the lender's app. We only help you compare.</p>

<a class="btn grey" href="index.html">← Back to Home</a>
</div>
</body>
