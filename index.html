<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    color: #111;
}

/* HEADER */
header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    color: #aaa;
    margin: 8px 0 0;
}

/* MAIN */
main {
    max-width: 750px;
    margin: auto;
    padding: 20px 15px 100px;
}

/* SEARCH */
.search-box {
    width: 100%;
    padding: 18px;
    border: 1px solid #ddd;
    border-radius: 25px;
    font-size: 18px;
    margin-bottom: 25px;
    outline: none;
}

/* LOAN CARDS */
.loan-card {
    background: white;
    padding: 25px;
    margin-bottom: 20px;
    border-radius: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.04);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.card-header h2 {
    margin: 0;
    font-size: 23px;
}

.badge {
    background: #e8f5e9;
    color: #388044;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.blue {
    background: #e5f2fc;
    color: #2871ad;
}

.orange {
    background: #fff0dd;
    color: #b76a20;
}

.details {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 20px 0;
}

.details span {
    background: #f0f2f4;
    padding: 10px 15px;
    border-radius: 25px;
    font-size: 15px;
}

.description {
    color: #666;
    font-size: 17px;
    line-height: 1.5;
    margin-bottom: 20px;
}

/* BUTTON */
.apply-btn {
    display: block;
    width: 100%;
    background: #111;
    color: white;
    text-align: center;
    text-decoration: none;
    padding: 20px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 18px;
}

.apply-btn:hover {
    background: #333;
}

/* PAGES */
.page {
    background: white;
    padding: 25px;
    border-radius: 22px;
    line-height: 1.7;
}

.page h2 {
    margin-top: 0;
}

/* FOOTER */

    text-align: center;
    color: #777;
    padding: 30px 10px;
}

footer a {
    color: #111;
    margin: 8px;
}

    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    background: white;
    border-top: 1px solid #ddd;
    padding: 15px 5px;
    z-index: 10;
}

.bottom-nav a {
    text-decoration: none;
    color: #222;
    font-size: 17px;
}

table {
    width: 100%;

th, td {

}

    .card-header h2 {
        font-size: 20px;
    }

    .details span {
        font-size: 14px;
    }

    .apply-btn {
        font-size: 18px;
    }

<body>

<header>
    <h1>PesaLoan254 🇰🇪</h1>
    <p>Compare trusted loan apps in Kenya</p>
</header>

<main id="content"></main>

<nav class="bottom-nav">
    <a href="#home">🏠 Home</a>
    <a href="#compare">📊 Compare</a>
    <a href="#contact">📞 Contact</a>
</nav>

<script>

/* LENDER DATABASE */

const lenders = [

{
name: "Tala Kenya",
badge: "TRUSTED",
amount: "KSh 1,000 - 30,000",
term: "61 Days",
rating: "4.5",
description: "No collateral. Get money in minutes via M-PESA.",
url: "https://tala.co.ke/"
},

{
name: "Branch",
badge: "POPULAR",
amount: "KSh 500 - 70,000",
term: "62 Days",
rating: "4.4",
description: "Build credit limit as you repay. Fast approval.",
url: "https://branch.co/"
},

{
name: "Zenka",
badge: "FIRST LOAN 0%",
amount: "KSh 500 - 50,000",
term: "61 Days",
rating: "4.3",
description: "Check current offers and loan requirements.",
url: "https://zenka.co.ke/"
},

{
name: "Timiza - Absa",
badge: "BANK",
amount: "KSh 500 - 100,000",
term: "30 Days",
rating: "4.0",
description: "From Absa Bank. Dial *848# or use the app.",
url: "https://www.absa.co.ke/"
},

{
name: "Okash",
badge: "FAST",
amount: "KSh 500 - 50,000",
term: "91 Days",
rating: "4.0",
description: "Quick loans for everyday needs.",
url: "https://play.google.com/store/search?q=Okash%20Kenya&c=apps"
},

{
name: "Haraka / PesaPap",
badge: "EASY",
amount: "KSh 500 - 20,000",
term: "30 Days",
rating: "4.0",
description: "Small loans for emergencies.",
url: "https://play.google.com/store/search?q=PesaPap%20Kenya&c=apps"
}

];


/* CREATE LOAN CARD */

function createCard(loan) {

return `
<div class="loan-card">

<div class="card-header">

<h2>${loan.name}</h2>

<span class="badge">${loan.badge}</span>

</div>

<div class="details">

<span>${loan.amount}</span>

<span>${loan.term}</span>

<span>⭐ ${loan.rating}</span>

</div>

<p class="description">
${loan.description}
</p>

<a class="apply-btn"
href="${loan.url}"
target="_blank"
rel="noopener noreferrer">

Apply Now →

</a>

</div>
`;

}


/* HOME PAGE */

function homePage() {

document.getElementById("content").innerHTML = `

<input
type="search"
class="search-box"
id="search"
placeholder="🔎 Search e.g. Zenka, Timiza, 50K..."
>

<div id="loan-list">

${lenders.map(createCard).join("")}

</div>

<footer>

<a href="#about">About</a> |
<a href="#privacy">Privacy</a> |
<a href="#terms">Terms</a> |
<a href="#contact">Contact</a>

<p>© 2026 PesaLoan254 - Not a lender</p>

</footer>

`;

document.getElementById("search")
.addEventListener("input", function() {

const query = this.value.toLowerCase();

const filtered = lenders.filter(loan =>

loan.name.toLowerCase().includes(query) ||
loan.amount.toLowerCase().includes(query) ||
loan.description.toLowerCase().includes(query)

);

document.getElementById("loan-list").innerHTML =
filtered.map(createCard).join("");

});

}


/* COMPARE PAGE */

function comparePage() {

let table = lenders.map(loan => `

<tr>

<td>${loan.name}</td>

<td>${loan.amount}</td>

<td>${loan.term}</td>

<td>⭐ ${loan.rating}</td>

</tr>

`).join("");

document.getElementById("content").innerHTML = `

<div class="page">

<h2>📊 Compare Loans</h2>

<p>Compare loan providers before applying.</p>

<div style="overflow-x:auto">

<table>

<tr>
<th>Lender</th>
<th>Amount</th>
<th>Period</th>
<th>Rating</th>
</tr>

${table}

</table>

</div>

<p>
Always check the lender's interest rate, fees,
repayment amount and loan conditions before borrowing.
</p>

</div>

`;

}


/* CONTACT PAGE */

function contactPage() {

document.getElementById("content").innerHTML = `

<div class="page">

<h2>📞 Contact Us</h2>

<p>For enquiries, corrections or partnerships:</p>

<p>
Email:
<a href="mailto:hello@pesaloan254.co.ke">
hello@pesaloan254.co.ke
</a>
</p>

</div>

`;

}


/* ABOUT PAGE */

function aboutPage() {

document.getElementById("content").innerHTML = `

<div class="page">

<h2>About PesaLoan254</h2>

<p>
PesaLoan254 helps visitors compare loan providers
and loan products available in Kenya.
</p>

<p>
We are an informational website.
We are not a bank or lender and we do not approve loans.
</p>

</div>

`;

}


/* PRIVACY PAGE */

function privacyPage() {

document.getElementById("content").innerHTML = `

<div class="page">

<h2>Privacy Policy</h2>

<p>
This website is designed to provide loan comparison information.
</p>

<p>
We do not collect personal financial information
through this demo website.
</p>

<p>
External lender websites have their own privacy policies.
</p>

</div>

`;

}


/* TERMS PAGE */

function termsPage() {

document.getElementById("content").innerHTML = `

<div class="page">

<h2>Terms and Conditions</h2>

<p>
Information on this website is for general informational purposes.
Loan details may change.
</p>

<p>
PesaLoan254 does not guarantee loan approval.
</p>

<p>
Always verify fees, interest, repayment dates,
eligibility and lender details before borrowing.
</p>

<p>
Borrow responsibly.
</p>

</div>

`;

}


/* NAVIGATION */

function router() {

const page = location.hash.replace("#", "");

switch(page) {

case "compare":
comparePage();
break;

case "contact":
contactPage();
break;

case "about":
aboutPage();
break;

case "privacy":
privacyPage();
break;

case "terms":
termsPage();
break;

default:
homePage();

}

}

window.addEventListener("hashchange", router);

router();

</script>

</body>
</html>
